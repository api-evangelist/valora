aid: valora
name: Valora
description: >-
  Valora is an open-source, self-custodial mobile crypto wallet focused on
  making digital assets and peer-to-peer payments simple and accessible from a
  phone. Born in the Celo ecosystem and now multichain (Celo, Ethereum,
  Arbitrum, Optimism, Base, Polygon), it pairs the wallet app with a public
  API for token prices, swap quotes, NFTs, and transaction simulation, plus
  the Divvi Hooks platform that lets developers extend the app with
  position-pricing and shortcut hooks. Valora Inc is backed by a16z and
  Polychain.
